<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💸 Expenses Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-inner">
        <h1>💸 Expenses Tracker</h1>
        <div class="month-picker">
          <button id="prevMonth" class="nav-btn">‹</button>
          <span id="currentMonthLabel" class="month-label"></span>
          <button id="nextMonth" class="nav-btn">›</button>
        </div>
      </div>
    </header>

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="summary-cards">
      <div class="card card-expense">
        <span class="card-label">Total Expenses</span>
        <span class="card-value" id="totalExpenses">₱0.00</span>
      </div>
      <div class="card card-income">
        <span class="card-label">Total Income</span>
        <span class="card-value" id="totalIncome">₱0.00</span>
      </div>
      <div class="card card-balance">
        <span class="card-label">Balance</span>
        <span class="card-value" id="balance">₱0.00</span>
      </div>
    </section>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">
      <!-- LEFT: FORMS -->
      <div class="forms">
        <!-- Expense Form -->
        <div class="form-section">
          <h2>➕ Add Expense</h2>
          <form id="expenseForm">
            <div class="form-row">
              <div class="form-group">
                <label for="expenseDate">Date</label>
                <input type="date" id="expenseDate" required />
              </div>
              <div class="form-group">
                <label for="expenseAmount">Amount (₱)</label>
                <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0" required />
              </div>
            </div>

            <div class="form-group">
              <label for="expenseDescription">Description</label>
              <input type="text" id="expenseDescription" placeholder="What did you spend on?" required />
            </div>

            <div class="form-group">
              <label>Categories <small>(select one or more)</small></label>
              <div class="category-grid" id="categoryGrid">
                <label class="category-chip">
                  <input type="checkbox" name="category" value="Food" />
                  <span>🍔 Food</span>
                </label>
                <label class="category-chip">
                  <input type="checkbox" name="category" value="GYM" />
                  <span>🏋️ GYM</span>
                </label>
                <label class="category-chip">
                  <input type="checkbox" name="category" value="Gas" />
                  <span>⛽ Gas</span>
                </label>
                <label class="category-chip">
                  <input type="checkbox" name="category" value="P.N" />
                  <span>📌 P.N</span>
                </label>
                <label class="category-chip category-all">
                  <input type="checkbox" id="selectAllCategories" />
                  <span>✅ Select All</span>
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-expense">Add Expense</button>
          </form>
        </div>

        <!-- Income Form -->
        <div class="form-section form-income">
          <h2>💰 Add Income (Salary / Side Hustle)</h2>
          <form id="incomeForm">
            <div class="form-row">
              <div class="form-group">
                <label for="incomeDate">Date</label>
                <input type="date" id="incomeDate" required />
              </div>
              <div class="form-group">
                <label for="incomeAmount">Amount (₱)</label>
                <input type="number" id="incomeAmount" placeholder="0.00" step="0.01" min="0" required />
              </div>
            </div>

            <div class="form-group">
              <label for="incomeDescription">Description</label>
              <input type="text" id="incomeDescription" placeholder="e.g. Salary, Freelance, etc." required />
            </div>

            <button type="submit" class="btn btn-income">Add Income</button>
          </form>
        </div>
      </div>

      <!-- RIGHT: BREAKDOWN + HISTORY -->
      <div class="data-panel">
        <!-- Category Breakdown -->
        <div class="panel-section">
          <h2>📊 Expenses by Category</h2>
          <div class="category-breakdown" id="categoryBreakdown">
            <p class="empty-msg">No expenses yet this month.</p>
          </div>
        </div>

        <!-- Transaction History -->
        <div class="panel-section">
          <div class="panel-header">
            <h2>📜 History</h2>
            <div class="filter-tabs">
              <button class="tab active" data-filter="all">All</button>
              <button class="tab" data-filter="expense">Expenses</button>
              <button class="tab" data-filter="income">Income</button>
            </div>
          </div>

          <div class="history-list" id="historyList">
            <p class="empty-msg">No transactions this month.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <p>💾 Data saved locally in your browser</p>
      <button id="clearMonth" class="btn btn-danger">🗑️ Clear This Month</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
